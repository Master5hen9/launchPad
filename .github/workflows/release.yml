name: Release

on:
  push:
    tags:
      - 'v*'
      - 'lts'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build release DMG
        run: bash dist/build_dmg.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF_NAME" == "lts" ]]; then
            TITLE="launchPad LTS"
          else
            TITLE="launchPad ${GITHUB_REF_NAME#v}"
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Floating tag (e.g. lts): refresh the existing release and asset.
            gh release edit "$GITHUB_REF_NAME" --title "$TITLE"
            gh release upload "$GITHUB_REF_NAME" dist/launchPad.dmg --clobber
          else
            gh release create "$GITHUB_REF_NAME" --title "$TITLE" --generate-notes dist/launchPad.dmg
          fi
