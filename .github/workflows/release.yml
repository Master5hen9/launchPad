name: Release

on:
  push:
    tags:
      - 'v*'
      - 'lts'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build release DMG
        run: bash dist/build_dmg.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF_NAME" == "lts" ]]; then
            TITLE="launchPad LTS"
          else
            TITLE="launchPad ${GITHUB_REF_NAME#v}"
          fi
          gh release create "$GITHUB_REF_NAME" --title "$TITLE" --generate-notes dist/launchPad.dmg
